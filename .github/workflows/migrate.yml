# The team story of a monolith split, as three CI lanes — for illustration, so
# everything targets the pr-to-me demo branch and nothing runs on main.
#
#   refactor-diff   every PR into pr-to-me — the standing gate. A developer runs
#                   `demonolith refactor` locally (plus `refactor validate` for the
#                   engine's own check) and the PR carries the map and the new module
#                   directories as ordinary files; `refactor diff` checks they still
#                   match the source. Offline, no credentials, seconds.
#
#   migrate-prove   every PR into pr-to-me — `migrate map` pulls the monolith's state read-only and
#                   splits local copies; `migrate prove` plans every new module to
#                   zero changes. Nothing is pushed, so a rejected PR leaves the
#                   world untouched.
#
#   migrate         manual (workflow_dispatch), on pr-to-me only — the cutover, run
#                   once, after the PR is merged and during a change freeze. Safe to
#                   re-run after a crash: already-pushed modules skip. No CI pre-gate
#                   is needed: demonolith itself refuses a stale or out-of-sync map.
#
# This sample builds a throwaway world per job (a simulated S3 state store, then the
# baseline apply) so the workflow is self-contained. In a real repository the store
# and the monolith's state already exist: the store and baseline steps disappear,
# and the values that .env carries here (the store credentials, TF_VAR_*) come from
# CI secrets instead of the checked-in mock defaults.

name: migrate

on:
  pull_request:
    branches: [pr-to-me]
  workflow_dispatch:

jobs:
  refactor-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install demonolith
        run: go install github.com/schrieksoft/demonolith@latest
      - name: refactor diff — the committed split still matches the source
        run: demonolith refactor diff

  migrate-prove:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: opentofu/setup-opentofu@v1
      - name: Install demonolith
        run: go install github.com/schrieksoft/demonolith@latest
      - name: Start the simulated S3 state store
        run: ./step0_store.sh
      - name: Establish the baseline (the monolith this run migrates)
        run: |
          ./step1_env.sh
          ./step2_baseline.sh
      - name: migrate map + prove — read-only, nothing pushed
        run: |
          source .env
          demonolith migrate map --engine tofu
          demonolith migrate prove --engine tofu --var "database_port=5432"

  migrate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/pr-to-me'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: opentofu/setup-opentofu@v1
      - name: Install demonolith
        run: go install github.com/schrieksoft/demonolith@latest
      - name: Start the simulated S3 state store
        run: ./step0_store.sh
      - name: Establish the baseline (the monolith this run migrates)
        run: |
          ./step1_env.sh
          ./step2_baseline.sh
      - name: migrate — map, prove, run, verify
        run: ./step4_migrate.sh
